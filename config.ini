[app]
# Координаты Maven-пакета: groupId:artifactId:version
package = A

# Базовый URL Maven-репозитория. Для учебного примера используется Maven Central.
repository_url = https://repo.maven.apache.org/maven2

# true — читать тестовый граф из файла; false — загружать POM из Maven-репозитория.
test_mode = true
test_repository = examples/test_repository.json

# Пакеты, в имени которых есть эта подстрока, пропускаются. Пустая строка отключает фильтр.
filter_substring =

# Папка для текстовой диаграммы и SVG-картинки.
output_dir = output

