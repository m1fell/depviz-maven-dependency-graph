[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "depviz"
version = "1.0.0"
description = "Учебный CLI-инструмент для анализа и визуализации графа зависимостей Maven"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
depviz = "depviz.cli:main"

[tool.setuptools.packages.find]
include = ["depviz*"]

